name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --workspace

  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Bundle CUDA llama-server
        shell: pwsh
        run: ./scripts/fetch-llama-server.ps1
      - name: Confirm llama-server.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/resources/llama/llama-server.exe")) {
            throw "cuda-13.5 llama-server.exe is missing"
          }
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*.exe
