[package]
name = "central-llm-interface"
version = "0.1.0"
edition = "2021"
description = "Central LLM Interface App desktop shell"
publish = false

[lib]
name = "central_llm_interface"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "central-llm-interface"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
central-llm-core = { path = "../crates/core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading"] }
